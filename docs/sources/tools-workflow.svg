<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 560" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13">
  <defs>
    <marker id="arr-right" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6" fill="#3B82F6"/>
    </marker>
    <marker id="arr-left" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6" fill="#10B981"/>
    </marker>
    <marker id="arr-right-purple" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6" fill="#6366F1"/>
    </marker>
    <marker id="arr-left-purple" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6" fill="#8B5CF6"/>
    </marker>
  </defs>

  <!-- Participant boxes -->
  <rect x="80" y="20" width="90" height="36" rx="6" fill="#3B82F6" />
  <text x="125" y="43" text-anchor="middle" fill="white" font-weight="600">Agent</text>

  <rect x="330" y="20" width="140" height="36" rx="6" fill="#6366F1" />
  <text x="400" y="43" text-anchor="middle" fill="white" font-weight="600">mcp-doc-server</text>

  <rect x="600" y="20" width="140" height="36" rx="6" fill="#F59E0B" />
  <text x="670" y="43" text-anchor="middle" fill="white" font-weight="600">grafana.com/docs</text>

  <!-- Lifelines -->
  <line x1="125" y1="56" x2="125" y2="530" stroke="#CBD5E1" stroke-width="1.5" stroke-dasharray="6,4"/>
  <line x1="400" y1="56" x2="400" y2="530" stroke="#CBD5E1" stroke-width="1.5" stroke-dasharray="6,4"/>
  <line x1="670" y1="56" x2="670" y2="530" stroke="#CBD5E1" stroke-width="1.5" stroke-dasharray="6,4"/>

  <!-- 1. search_docs -->
  <line x1="130" y1="95" x2="392" y2="95" stroke="#3B82F6" stroke-width="1.5" marker-end="url(#arr-right)"/>
  <rect x="162" y="77" width="230" height="22" rx="4" fill="white" stroke="#E2E8F0" stroke-width="1"/>
  <text x="277" y="92" text-anchor="middle" fill="#1E293B" font-size="12">search_docs("Loki retention")</text>

  <!-- response: ranked results -->
  <line x1="395" y1="135" x2="133" y2="135" stroke="#10B981" stroke-width="1.5" stroke-dasharray="6,3" marker-end="url(#arr-left)"/>
  <rect x="177" y="117" width="180" height="22" rx="4" fill="white" stroke="#E2E8F0" stroke-width="1"/>
  <text x="267" y="132" text-anchor="middle" fill="#1E293B" font-size="12">ranked results + URLs</text>

  <!-- 2. get_doc_outline -->
  <line x1="130" y1="185" x2="392" y2="185" stroke="#3B82F6" stroke-width="1.5" marker-end="url(#arr-right)"/>
  <rect x="177" y="167" width="185" height="22" rx="4" fill="white" stroke="#E2E8F0" stroke-width="1"/>
  <text x="270" y="182" text-anchor="middle" fill="#1E293B" font-size="12">get_doc_outline(url)</text>

  <!-- server fetches from docs -->
  <line x1="405" y1="225" x2="662" y2="225" stroke="#6366F1" stroke-width="1.5" marker-end="url(#arr-right-purple)"/>
  <rect x="460" y="207" width="140" height="22" rx="4" fill="white" stroke="#E2E8F0" stroke-width="1"/>
  <text x="530" y="222" text-anchor="middle" fill="#1E293B" font-size="12">fetch page (.md)</text>

  <!-- docs returns raw markdown -->
  <line x1="665" y1="260" x2="408" y2="260" stroke="#8B5CF6" stroke-width="1.5" stroke-dasharray="6,3" marker-end="url(#arr-left-purple)"/>
  <rect x="467" y="242" width="130" height="22" rx="4" fill="white" stroke="#E2E8F0" stroke-width="1"/>
  <text x="532" y="257" text-anchor="middle" fill="#1E293B" font-size="12">raw Markdown</text>

  <!-- server returns heading list -->
  <line x1="395" y1="295" x2="133" y2="295" stroke="#10B981" stroke-width="1.5" stroke-dasharray="6,3" marker-end="url(#arr-left)"/>
  <rect x="197" y="277" width="130" height="22" rx="4" fill="white" stroke="#E2E8F0" stroke-width="1"/>
  <text x="262" y="292" text-anchor="middle" fill="#1E293B" font-size="12">heading list</text>

  <!-- 3. get_doc with section -->
  <line x1="130" y1="345" x2="392" y2="345" stroke="#3B82F6" stroke-width="1.5" marker-end="url(#arr-right)"/>
  <rect x="140" y="327" width="250" height="22" rx="4" fill="white" stroke="#E2E8F0" stroke-width="1"/>
  <text x="265" y="342" text-anchor="middle" fill="#1E293B" font-size="12">get_doc(url, section="Retention")</text>

  <!-- server fetches from docs again -->
  <line x1="405" y1="385" x2="662" y2="385" stroke="#6366F1" stroke-width="1.5" marker-end="url(#arr-right-purple)"/>
  <rect x="460" y="367" width="140" height="22" rx="4" fill="white" stroke="#E2E8F0" stroke-width="1"/>
  <text x="530" y="382" text-anchor="middle" fill="#1E293B" font-size="12">fetch page (.md)</text>

  <!-- docs returns raw markdown -->
  <line x1="665" y1="420" x2="408" y2="420" stroke="#8B5CF6" stroke-width="1.5" stroke-dasharray="6,3" marker-end="url(#arr-left-purple)"/>
  <rect x="467" y="402" width="130" height="22" rx="4" fill="white" stroke="#E2E8F0" stroke-width="1"/>
  <text x="532" y="417" text-anchor="middle" fill="#1E293B" font-size="12">raw Markdown</text>

  <!-- server returns cleaned section -->
  <line x1="395" y1="460" x2="133" y2="460" stroke="#10B981" stroke-width="1.5" stroke-dasharray="6,3" marker-end="url(#arr-left)"/>
  <rect x="177" y="442" width="180" height="22" rx="4" fill="white" stroke="#E2E8F0" stroke-width="1"/>
  <text x="267" y="457" text-anchor="middle" fill="#1E293B" font-size="12">cleaned section slice</text>
</svg>
